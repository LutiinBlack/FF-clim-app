<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FF CLIM — Rapports & documents</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23267E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FF CLIM">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy: #23267E;
    --navy-deep: #171A5C;
    --cyan: #00AEEA;
    --cyan-soft: #E4F7FD;
    --paper: #FFFFFF;
    --canvas: #EEF1FB;
    --ink: #1B1E30;
    --ink-soft: #5B5F78;
    --line: #DADEEF;
    --danger: #C4432B;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(23,26,92,0.06), 0 8px 24px rgba(23,26,92,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:24px;
  }
  body.has-bottombar{padding-bottom:88px;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:14px 20px;
    background:var(--navy);
    color:#fff;
    position:sticky; top:0; z-index:20;
  }
  .topbar img.logo-img{width:34px; height:34px; border-radius:50%; display:block; flex-shrink:0;}
  .back-btn{
    background:rgba(255,255,255,0.12); border:none; color:#fff; width:32px; height:32px;
    border-radius:50%; font-size:17px; cursor:pointer; flex-shrink:0; display:flex;
    align-items:center; justify-content:center;
  }
  .topbar .brand{font-size:15px; font-weight:700; letter-spacing:0.2px; line-height:1.15;}
  .topbar .brand small{display:block; font-weight:400; font-size:11px; color:#B9C1F0; font-family:'Inter',sans-serif;}
  .topbar .tabs{margin-left:auto; display:flex; gap:4px; background:rgba(255,255,255,0.1); padding:4px; border-radius:999px;}
  .topbar .tabs button{
    border:none; background:transparent; color:#CDD3F5;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    padding:7px 14px; border-radius:999px; cursor:pointer;
  }
  .topbar .tabs button.active{background:var(--cyan); color:#04283A;}
  .install-btn{
    display:none; align-items:center; gap:6px; margin-left:10px;
    background:var(--cyan); color:#04283A; border:none; border-radius:999px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px;
    padding:7px 13px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }

  /* ---------- Screens ---------- */
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- Home screen ---------- */
  .home-wrap{max-width:900px; margin:0 auto; padding:22px 18px 10px;}
  .home-hero{margin-bottom:18px;}
  .home-hero h1{font-size:19px; margin:0 0 4px; color:var(--navy-deep);}
  .home-hero p{font-size:13px; color:var(--ink-soft); margin:0;}
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(min-width:640px){ .cat-grid{grid-template-columns:1fr 1fr 1fr;} }
  .cat-card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:18px 14px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; min-height:130px;
  }
  .cat-card:active{transform:scale(0.98);}
  .cat-card .cat-icon{
    width:38px; height:38px; border-radius:10px; background:var(--cyan-soft); color:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  .cat-card .cat-icon svg{width:20px; height:20px;}
  .cat-card .cat-label{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px; color:var(--ink);}
  .cat-card .cat-desc{font-size:11.5px; color:var(--ink-soft); line-height:1.4;}
  .cat-card.cerfa{background:var(--navy); border-color:var(--navy);}
  .cat-card.cerfa .cat-icon{background:rgba(255,255,255,0.15); color:#fff;}
  .cat-card.cerfa .cat-label{color:#fff;}
  .cat-card.cerfa .cat-desc{color:#B9C1F0;}

  /* ---------- Layout (report screens) ---------- */
  .wrap{
    max-width:1180px; margin:0 auto; padding:22px 18px 0;
    display:grid; grid-template-columns: 1fr; gap:20px;
  }
  @media(min-width: 980px){
    .wrap{grid-template-columns: minmax(0,1fr) 400px; align-items:start;}
    .local-tabs{display:none;}
    .panel{display:block !important;}
  }
  .local-tabs{
    display:flex; gap:4px; background:#fff; border:1px solid var(--line); padding:4px; border-radius:999px;
    max-width:280px; margin:0 auto 16px;
  }
  .local-tabs button{
    flex:1; border:none; background:transparent; color:var(--ink-soft);
    font-weight:600; font-size:13px; padding:8px 10px; border-radius:999px; cursor:pointer;
  }
  .local-tabs button.active{background:var(--navy); color:#fff;}

  .panel{background:transparent;}
  .panel.form-panel{display:block;}
  .panel.preview-panel{display:none;}
  @media(min-width: 980px){ .panel.preview-panel{display:block; position:sticky; top:80px;} }

  /* ---------- Cards / sections ---------- */
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card h2{
    font-size:14px; margin:0 0 14px; color:var(--navy-deep);
    display:flex; align-items:center; gap:9px; font-weight:700;
  }
  .card h2 .num{
    width:20px; height:20px; border-radius:5px; background:var(--cyan-soft); color:var(--navy);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
    font-family:'Inter',sans-serif; flex-shrink:0;
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field textarea, .field select{
    width:100%; border:1px solid var(--line); border-radius:7px;
    padding:9px 11px; font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink);
    background:#FCFDFF;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--cyan); background:#fff;
    box-shadow:0 0 0 3px rgba(0,174,234,0.15);
  }
  .field textarea{resize:vertical; min-height:64px; line-height:1.45;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  @media(max-width:480px){.grid2{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;}}

  .subgroup{border-top:1px dashed var(--line); padding-top:14px; margin-top:14px;}
  .subgroup:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  .subgroup-title{font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:10px;}

  /* ---------- bullet list ---------- */
  .bullet-row{display:flex; gap:8px; margin-bottom:8px; align-items:flex-start;}
  .bullet-row input{flex:1;}
  .icon-btn{
    border:none; background:var(--cyan-soft); color:var(--navy); width:32px; height:32px;
    border-radius:7px; cursor:pointer; font-size:16px; flex-shrink:0; line-height:1;
  }
  .icon-btn.remove{background:#FBEAE6; color:var(--danger);}
  .add-btn{
    border:1.5px dashed var(--line); background:transparent; color:var(--navy);
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:9px 14px; border-radius:7px; cursor:pointer; width:100%; margin-top:2px;
  }
  .add-btn:hover{border-color:var(--cyan); background:var(--cyan-soft);}

  /* ---------- photos ---------- */
  .photo-card{
    border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px;
    display:grid; grid-template-columns:72px 1fr auto; gap:12px; align-items:center;
  }
  .photo-thumb{
    width:72px; height:72px; border-radius:7px; object-fit:cover; background:var(--canvas);
    border:1px solid var(--line);
  }
  .photo-thumb.empty{display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:10px; text-align:center;}
  .photo-meta input[type=file]{font-size:11.5px; margin-bottom:6px; width:100%;}
  .photo-meta input[type=text]{width:100%;}

  /* ---------- preview paper ---------- */
  .preview-scroll{max-height: calc(100vh - 130px); overflow-y:auto; padding-right:2px;}
  .paper{
    background:#fff; border:1px solid var(--line); border-radius:8px;
    box-shadow:var(--shadow); padding:22px 20px 16px; position:relative;
    margin-bottom:16px;
  }
  .paper .logo{
    width:26%; aspect-ratio:1; border-radius:50%; display:block; margin:0 auto 10px;
    object-fit:cover;
  }
  .paper .overline{text-align:center; font-size:8px; font-weight:700; letter-spacing:1px; color:var(--cyan); margin-bottom:2px;}
  .paper h3{
    text-align:center; font-size:15px; margin:0 0 3px; color:var(--ink); letter-spacing:0.2px;
  }
  .paper .sub{text-align:center; font-size:9.5px; font-weight:700; color:var(--navy); margin-bottom:10px;}
  .paper table{width:100%; border-collapse:collapse; font-size:7px; margin-bottom:10px;}
  .paper table td{border:1px solid var(--line); padding:4px 6px;}
  .paper table td:first-child{background:var(--cyan-soft); color:var(--navy); font-weight:700; width:32%;}
  .paper .sec-title{font-size:8px; font-weight:700; color:var(--navy); margin:9px 0 3px;}
  .paper .sec-body{font-size:6.6px; line-height:1.5; color:#333; white-space:pre-wrap;}
  .paper .conclusion{font-size:6.6px; line-height:1.5; color:#333; font-weight:700; margin-top:9px;}
  .paper .foot{
    margin-top:16px; font-size:6px; color:#999;
    border-top:1px solid var(--line); padding-top:5px; display:flex; justify-content:space-between;
  }
  .paper.photos-page h3{margin-bottom:14px;}
  .preview-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; text-align:center;}
  .pv-photo-block{margin-bottom:14px;}
  .pv-photo-block img{width:100%; max-height:170px; object-fit:contain; display:block; border-radius:5px; background:var(--canvas); border:1px solid var(--line);}
  .pv-photo-block .cap{text-align:center; font-size:7px; font-style:italic; color:#888; margin-top:4px;}

  /* ---------- CERFA form ---------- */
  .cerfa-wrap{max-width:760px; margin:0 auto; padding:20px 18px 100px;}
  .cerfa-intro{font-size:12.5px; color:var(--ink-soft); background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; line-height:1.5;}
  .cerfa-intro b{color:var(--navy-deep);}
  details.cerfa-section{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden;
  }
  details.cerfa-section[open]{padding-bottom:14px;}
  details.cerfa-section summary{
    list-style:none; cursor:pointer; padding:14px 16px; font-weight:700; font-size:13.5px;
    color:var(--navy-deep); display:flex; align-items:center; gap:9px;
  }
  details.cerfa-section summary::-webkit-details-marker{display:none;}
  details.cerfa-section summary .num{
    width:22px; height:22px; border-radius:6px; background:var(--cyan-soft); color:var(--navy);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;
  }
  details.cerfa-section summary .chev{margin-left:auto; font-size:12px; color:var(--ink-soft); transition:transform .15s;}
  details.cerfa-section[open] summary .chev{transform:rotate(180deg);}
  .cerfa-body{padding:2px 16px 4px;}
  .check-row{display:flex; align-items:flex-start; gap:9px; margin-bottom:10px; font-size:13px;}
  .check-row input[type=checkbox], .check-row input[type=radio]{margin-top:2px; width:16px; height:16px; flex-shrink:0;}
  .check-row label{font-size:13px; color:var(--ink); line-height:1.35;}
  .radio-line{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:10px;}
  .radio-line .opt{display:flex; align-items:center; gap:6px; font-size:12.5px;}
  .row-label{font-size:12px; font-weight:600; color:var(--ink-soft); margin:12px 0 6px;}
  .fuite-row{display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; margin-bottom:8px;}
  .fuite-row span{font-size:12px; color:var(--ink-soft); font-weight:700;}

  /* ---------- bottom bar ---------- */
  .bottombar{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    padding:12px 18px; display:none; align-items:center; justify-content:center; gap:12px;
    box-shadow:0 -6px 18px rgba(23,26,92,0.08); z-index:30;
  }
  .bottombar.visible{display:flex;}
  .btn-primary{
    background:var(--navy); color:#fff; border:none; font-family:'Inter',sans-serif;
    font-weight:700; font-size:14.5px; padding:13px 26px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; gap:8px; max-width:420px; width:100%; justify-content:center;
  }
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-primary:disabled{opacity:0.6; cursor:wait;}
  .status-msg{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:6px;}

/* ---------- Login screen ---------- */
  .login-wrap{min-height:80vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:28px 24px; width:100%; max-width:340px; text-align:center;
  }
  .login-card .login-logo{width:64px; height:64px; border-radius:50%; margin:0 auto 14px; display:block;}
  .login-card h1{font-size:17px; margin:0 0 18px; color:var(--navy-deep);}
  .login-card .field{text-align:left;}
  .login-error{color:var(--danger); font-size:12.5px; min-height:16px; margin:6px 0 12px;}
  .logout-btn{
    display:none; align-items:center; justify-content:center; margin-left:8px;
    background:rgba(255,255,255,0.12); border:none; color:#fff; width:32px; height:32px;
    border-radius:50%; font-size:15px; cursor:pointer; flex-shrink:0;
  }

  /* ---------- Admin panel ---------- */
  .admin-wrap{max-width:760px; margin:0 auto; padding:20px 18px 40px;}
  .cat-card.admin{background:#fff; border:1.5px solid var(--cyan);}
  .cat-card.admin .cat-icon{background:var(--cyan); color:#fff;}
  .user-row{border:1px solid var(--line); border-radius:10px; padding:13px 14px; margin-bottom:10px; background:#FCFDFF;}
  .user-row-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .user-name{font-weight:700; font-size:13.5px; color:var(--ink);}
  .you-tag{font-size:10px; font-weight:600; color:var(--cyan); background:var(--cyan-soft); padding:1px 6px; border-radius:999px; margin-left:6px;}
  .user-email{font-size:11.5px; color:var(--ink-soft);}
  .admin-toggle{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--navy); white-space:nowrap;}
  .perm-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .perm-chip{display:flex; align-items:center; gap:5px; font-size:11.5px; background:var(--canvas); border:1px solid var(--line); border-radius:999px; padding:4px 10px;}
  .adm_delete_btn{background:#FBEAE6; color:var(--danger); border:none; border-radius:7px; font-size:11.5px; font-weight:600; padding:7px 12px; cursor:pointer; width:auto; height:auto;}

  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .edit-toggle-btn{
    background:var(--cyan-soft); color:var(--navy); border:none; border-radius:7px;
    font-size:11.5px; font-weight:600; padding:7px 12px; cursor:pointer;
  }
  .edit-panel{margin-top:10px; padding-top:12px; border-top:1px dashed var(--line);}

  .clear-bar{display:flex; justify-content:flex-end; margin-bottom:10px;}
  .clear-btn{
    background:#FBEAE6; color:var(--danger); border:none; border-radius:7px;
    font-size:12px; font-weight:600; padding:8px 12px; cursor:pointer;
  }

  /* ---------- History ---------- */
  .history-wrap{max-width:760px; margin:0 auto; padding:20px 18px 40px;}
  .hist-row{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
    background:#fff; display:flex; justify-content:space-between; align-items:center; gap:10px;
    box-shadow:var(--shadow);
  }
  .hist-main{flex:1; min-width:0;}
  .hist-badge{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px;
    padding:3px 8px; border-radius:999px; background:var(--cyan-soft); color:var(--navy);
    display:inline-block; margin-bottom:5px;
  }
  .hist-title{font-weight:700; font-size:13px; color:var(--ink);}
  .hist-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .hist-dl-btn{
    background:var(--navy); color:#fff; border:none; border-radius:7px;
    font-size:13px; font-weight:600; padding:9px 13px; cursor:pointer; flex-shrink:0;
  }

  ::placeholder{color:#A7ABC4;}
</style>
</head>
<body>

   ================================================================ */
const SUPABASE_URL = "https://iqmbrppvuzvhblfmazlk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mrJxo9IBH29P8GZC0H47sQ_ftu5UAEM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let currentPermissions = {};

async function loadProfileAndPermissions(){
  const { data: profile, error: pErr } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if(pErr){ console.error(pErr); return false; }
  currentProfile = profile;
  const { data: perms } = await sb.from('permissions').select('category, allowed').eq('user_id', currentUser.id);
  currentPermissions = {};
  (perms || []).forEach(p => { currentPermissions[p.category] = p.allowed; });
  return true;
}

function categoryAllowed(key){
  if(!currentProfile) return false;
  if(currentProfile.role === 'admin') return true;
  return !!currentPermissions[key];
}

function onLoggedIn(){
  document.getElementById('logoutBtn').style.display = 'flex';
  renderHomeGrid();
  showScreen('home');
}

async function doLogin(){
  const email = document.getElementById('login_email').value.trim();
  const password = document.getElementById('login_password').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = "Renseignez votre email et votre mot de passe."; return; }
  btn.disabled = true; btn.textContent = 'Connexion...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Se connecter';
  if(error){ errEl.textContent = "Identifiants incorrects."; return; }
  currentUser = data.user;
  const ok = await loadProfileAndPermissions();
  if(!ok){ errEl.textContent = "Impossible de charger votre profil."; return; }
  onLoggedIn();
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser = null; currentProfile = null; currentPermissions = {};
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('login_email').value = '';
  document.getElementById('login_password').value = '';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-login').classList.add('active');
  currentScreen = 'login';
}

async function checkExistingSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    currentUser = data.session.user;
    const ok = await loadProfileAndPermissions();
    if(ok){ onLoggedIn(); return; }
  }
}

const REPORT_CATEGORIES = [
  {key:'diagnostic',  label:'Diagnostic',  icon:'search', desc:"Constat et recherche de panne"},
  {key:'travaux',     label:'Travaux',     icon:'wrench', desc:"Travaux réalisés sur site"},
  {key:'depannage',   label:'Dépannage',   icon:'bolt',   desc:"Intervention de dépannage"},
  {key:'maintenance', label:'Maintenance', icon:'tools',  desc:"Entretien et maintenance"},
];

function renderHomeGrid(){
  const grid = document.getElementById('catGrid');
  let html = '';
  REPORT_CATEGORIES.forEach(c => {
    if(!categoryAllowed(c.key)) return;
    html += `<button class="cat-card" data-key="${c.key}">
      <div class="cat-icon">${ICONS[c.icon]}</div>
      <div class="cat-label">${c.label}</div>
      <div class="cat-desc">${c.desc}</div>
    </button>`;
  });
    if(categoryAllowed('cerfa')){
    html += `<button class="cat-card cerfa" data-key="cerfa">
      <div class="cat-icon">${ICONS.doc}</div>
      <div class="cat-label">CERFA fluides</div>
      <div class="cat-desc">Fiche d'intervention officielle (F-Gas)</div>
    </button>`;
  }
  if(currentProfile){
    html += `<button class="cat-card" data-key="history">
      <div class="cat-icon">${ICONS.clock}</div>
      <div class="cat-label">Historique</div>
      <div class="cat-desc">Tous les rapports générés</div>
    </button>`;
  }
  if(currentProfile && currentProfile.role === 'admin'){
    html += `<button class="cat-card admin" data-key="admin">
      <div class="cat-icon">${ICONS.tools}</div>
      <div class="cat-label">Administration</div>
      <div class="cat-desc">Gérer les utilisateurs et leurs droits</div>
    </button>`;
  }
  if(!html){
    html = `<p style="grid-column:1/-1; color:var(--ink-soft); font-size:13px;">Aucune catégorie ne vous a encore été attribuée. Contactez un administrateur.</p>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cat-card').forEach(btn => {
    btn.addEventListener('click', () => showScreen(btn.dataset.key));
  });
}

function initReportModule(key){
  document.getElementById('screen-' + key).innerHTML = reportScreenTemplate(key);
  const $ = (id) => document.getElementById(id + '__' + key);
  const container = document.getElementById('screen-' + key);

  /* ---- bullets ---- */
  const bulletsList = $('bulletsList');
  function addBulletRow(value=''){
    const row = document.createElement('div');
    row.className = 'bullet-row';
    row.innerHTML = `<input type="text" class="bullet-input" placeholder="ex. Remplacement du filtre" value="${value.replace(/"/g,'&quot;')}">
                      <button class="icon-btn remove" type="button" title="Supprimer">✕</button>`;
    row.querySelector('.remove').onclick = () => { row.remove(); updatePreview(); };
    row.querySelector('input').addEventListener('input', updatePreview);
    bulletsList.appendChild(row);
  }
  $('addBulletBtn').onclick = () => addBulletRow();
  addBulletRow(); addBulletRow();

  /* ---- photos ---- */
  const photosList = $('photosList');
  let photoSeq = 0;
  function addPhotoRow(){
    const id = key + '_photo_' + (photoSeq++);
    const row = document.createElement('div');
    row.className = 'photo-card';
    row.dataset.id = id;
    row.innerHTML = `
      <div class="photo-thumb empty" id="${id}_thumbwrap">Aucune<br>photo</div>
      <div class="photo-meta">
        <input type="file" accept="image/*" id="${id}_file">
        <input type="text" placeholder="Légende (ex. Chambre RDC - soufflage)" id="${id}_caption">
      </div>
      <button class="icon-btn remove" type="button" title="Supprimer">✕</button>
    `;
    row.querySelector('.remove').onclick = () => { row.remove(); updatePreview(); };
    const fileInput = row.querySelector(`#${id}_file`);
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
          row.dataset.dataUrl = dataUrl;
          row.dataset.w = canvas.width;
          row.dataset.h = canvas.height;
          const thumbWrap = document.getElementById(`${id}_thumbwrap`);
          thumbWrap.outerHTML = `<img class="photo-thumb" id="${id}_thumbwrap" src="${dataUrl}">`;
          updatePreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    row.querySelector(`#${id}_caption`).addEventListener('input', updatePreview);
    photosList.appendChild(row);
  }
  $('addPhotoBtn').onclick = () => addPhotoRow();
  addPhotoRow();

 
  /* ---- draft (auto-save) ---- */
  function draftKey(){ return 'ffclim_draft_' + key; }
  function saveDraft(){
    const data = {
      f_titre: $('f_titre').value, f_client: $('f_client').value, f_adresse: $('f_adresse').value,
      f_date: $('f_date').value, f_intervenant: $('f_intervenant').value, f_objet: $('f_objet').value,
      s1_titre: $('s1_titre').value, s1_texte: $('s1_texte').value, s1_preco: $('s1_preco').value,
      s2_titre: $('s2_titre').value, s2_texte: $('s2_texte').value, s2_preco: $('s2_preco').value,
      f_conclusion: $('f_conclusion').value,
      bullets: [...container.querySelectorAll('.bullet-input')].map(i => i.value),
    };
    try{ localStorage.setItem(draftKey(), JSON.stringify(data)); } catch(e){}
  }
  function clearDraft(){
    try{ localStorage.removeItem(draftKey()); } catch(e){}
  }
  function loadDraft(){
    let data = null;
    try{ const raw = localStorage.getItem(draftKey()); if(raw) data = JSON.parse(raw); } catch(e){}
    if(!data) return;
    ['f_titre','f_client','f_adresse','f_date','f_intervenant','f_objet','s1_titre','s1_texte','s1_preco','s2_titre','s2_texte','s2_preco','f_conclusion'].forEach(id => {
      if(data[id] !== undefined) $(id).value = data[id];
    });
    if(Array.isArray(data.bullets) && data.bullets.length){
      bulletsList.innerHTML = '';
      data.bullets.forEach(b => addBulletRow(b));
    }
  }
  loadDraft();

  /* ---- clear all ---- */
  function resetForm(){
    ['f_titre','f_client','f_adresse','f_date','f_intervenant','f_objet','s1_titre','s1_texte','s1_preco','s2_titre','s2_texte','s2_preco','f_conclusion'].forEach(id => { $(id).value = ''; });
    bulletsList.innerHTML = '';
    addBulletRow(); addBulletRow();
    photosList.innerHTML = '';
    photoSeq = 0;
    addPhotoRow();
    clearDraft();
    updatePreview();
  }
  function clearAll(){
    if(!confirm('Effacer toute la saisie de ce formulaire ? Cette action est irréversible.')) return;
    resetForm();
  }
  $('clearBtn').addEventListener('click', clearAll);

  /* ---- live preview ---- */
  function esc(s){ return (s||'').toString(); }
  function updatePreview(){
    $('pv_sub').textContent = esc($('f_titre').value) || '[Titre de la mission]';
    $('pv_client').textContent = esc($('f_client').value) || '—';
    $('pv_adresse').textContent = esc($('f_adresse').value) || '—';
    $('pv_date').textContent = esc($('f_date').value) || '—';
    $('pv_intervenant').textContent = esc($('f_intervenant').value) || '—';
    $('pv_objet').textContent = esc($('f_objet').value) || '—';
    $('pv_s1t').textContent = '1. ' + (esc($('s1_titre').value) || '—');
    $('pv_s1b').textContent = esc($('s1_texte').value) || '—';
    $('pv_s2t').textContent = '2. ' + (esc($('s2_titre').value) || '—');
    $('pv_s2b').textContent = esc($('s2_texte').value) || '—';

    const bulletVals = [...container.querySelectorAll('.bullet-input')].map(i=>i.value.trim()).filter(Boolean);
    $('pv_bullets').textContent = bulletVals.length ? bulletVals.map(b=>'• '+b).join('\n') : '—';

    const conclusion = esc($('f_conclusion').value);
    $('pv_conclusion').textContent = conclusion ? ('Conclusion : ' + conclusion) : '';

    const pv_photos = $('pv_photos');
    const pv_photos_page = $('pv_photos_page');
    pv_photos.innerHTML = '';
    const cardsWithPhotos = [...container.querySelectorAll('.photo-card')].filter(c => c.dataset.dataUrl);
    if(cardsWithPhotos.length){
      pv_photos_page.style.display = 'block';
      cardsWithPhotos.forEach(card => {
        const block = document.createElement('div');
        block.className = 'pv-photo-block';
        const caption = card.querySelector('input[type=text]').value.trim();
        block.innerHTML = `<img src="${card.dataset.dataUrl}"><div class="cap">${esc(caption)}</div>`;
        pv_photos.appendChild(block);
      });
      } else {
      pv_photos_page.style.display = 'none';
    }
    saveDraft();
  }
  ['f_titre','f_client','f_adresse','f_date','f_intervenant','f_objet','s1_titre','s1_texte','s2_titre','s2_texte','f_conclusion'].forEach(id=>{
    $(id).addEventListener('input', updatePreview);
  });
  updatePreview();

  /* ---- PDF generation ---- */
  function val(id){ return $(id).value.trim(); }

  function wrapAndDraw(doc, text, x, y, maxWidth, lineHeight, fontSize, color, bold=false){
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    doc.setFontSize(fontSize);
    doc.setTextColor(color[0], color[1], color[2]);
    const lines = doc.splitTextToSize(text, maxWidth);
    lines.forEach(line => { doc.text(line, x, y); y += lineHeight; });
    return y;
  }
  function drawFooter(doc, pageNum){
    const pw = doc.internal.pageSize.getWidth();
    const ph = doc.internal.pageSize.getHeight();
    doc.setDrawColor(204,204,204);
    doc.line(22, ph-19, pw-22, ph-19);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(102,102,102);
    doc.text("FF CLIM - Installation, dépannage et maintenance climatisation", 22, ph-15);
    doc.text("Page " + pageNum, pw-22, ph-15, {align:'right'});
  }

  async function generatePDF(){
    const btn = document.getElementById('downloadBtn');
    const statusMsg = document.getElementById('statusMsg');
    btn.disabled = true; statusMsg.textContent = 'Génération du PDF en cours...';
    try{
      const doc = new jsPDF({unit:'mm', format:'a4'});
      const pw = doc.internal.pageSize.getWidth();
      const ph = doc.internal.pageSize.getHeight();
      const marginX = 22;
      const contentW = pw - marginX*2;
      let page = 1;

      const logoSize = 42;
      doc.addImage(LOGO_B64, 'JPEG', pw/2 - logoSize/2, 16.1, logoSize, logoSize);

      let y = 60;
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(0,174,234);
      doc.text(CATEGORY_LABELS[key].toUpperCase(), pw/2, y, {align:'center'});
      y += 6;
      doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(26,26,26);
      doc.text("RAPPORT D'INTERVENTION", pw/2, y, {align:'center'});
      y += 8;
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(35,38,126);
      const titreMission = val('f_titre') || "[Titre de la mission]";
      const titreLines = doc.splitTextToSize(titreMission, contentW);
      titreLines.forEach(l => { doc.text(l, pw/2, y, {align:'center'}); y += 5.5; });
      y += 4;

      const rows = [
        ["Client", val('f_client')],
        ["Adresse", val('f_adresse')],
        ["Date d'intervention", val('f_date')],
        ["Intervenant", val('f_intervenant')],
        ["Objet", val('f_objet')],
      ];
      doc.autoTable({
        startY: y, margin: {left: marginX, right: marginX}, body: rows, theme: 'grid',
        styles: {font:'helvetica', fontSize:9.5, cellPadding:2.2, lineColor:[204,204,204], lineWidth:0.15, textColor:[26,26,26]},
        columnStyles: {0: {cellWidth:42, fontStyle:'bold', textColor:[31,95,168], fillColor:[234,241,251]}, 1: {cellWidth:contentW-42}},
      });
      y = doc.lastAutoTable.finalY + 8;

      function section(num, titre, texte, preco){
        if(!titre && !texte && !preco) return;
        if(y > ph - 45){ drawFooter(doc,page); doc.addPage(); page++; y = 25; }
        doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(31,95,168);
        doc.text(num + '. ' + (titre || ''), marginX, y);
        y += 7;
        if(texte){ y = wrapAndDraw(doc, texte, marginX, y, contentW, 5.1, 10, [26,26,26]); y += 2; }
        if(preco){ y = wrapAndDraw(doc, "Préconisation : " + preco, marginX, y, contentW, 5.1, 10, [26,26,26], true); y += 2; }
        y += 3;
      }
      section(1, val('s1_titre'), val('s1_texte'), val('s1_preco'));
      section(2, val('s2_titre'), val('s2_texte'), val('s2_preco'));

      const bulletVals = [...container.querySelectorAll('.bullet-input')].map(i=>i.value.trim()).filter(Boolean);
      if(bulletVals.length){
        if(y > ph - 45){ drawFooter(doc,page); doc.addPage(); page++; y = 25; }
        doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(31,95,168);
        doc.text("3. Synthèse des travaux à prévoir", marginX, y);
        y += 7;
        bulletVals.forEach(b => {
          if(y > ph - 30){ drawFooter(doc,page); doc.addPage(); page++; y = 25; }
          doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(26,26,26);
          const lines = doc.splitTextToSize(b, contentW - 6);
          doc.text('•', marginX+2, y);
          lines.forEach((l,i) => { doc.text(l, marginX+7, y + i*5.1); });
          y += lines.length*5.1 + 1.5;
        });
        y += 3;
      }

      const conclusion = val('f_conclusion');
      if(conclusion){
        if(y > ph - 40){ drawFooter(doc,page); doc.addPage(); page++; y = 25; }
        y = wrapAndDraw(doc, "Conclusion : " + conclusion, marginX, y, contentW, 5.1, 10, [26,26,26], true);
      }
      drawFooter(doc, page);

      const photoCards = [...container.querySelectorAll('.photo-card')].filter(c => c.dataset.dataUrl);
      if(photoCards.length){
        doc.addPage(); page++;
        let py = 25;
        doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(26,26,26);
        doc.text("PHOTOS DE L'INTERVENTION", pw/2, py, {align:'center'});
        py += 14;
        const maxH = 88, maxW = contentW;
        photoCards.forEach(card => {
          const w = parseFloat(card.dataset.w), h = parseFloat(card.dataset.h);
          let imgW = maxH * (w/h), imgH = maxH;
          if(imgW > maxW){ imgW = maxW; imgH = maxW * (h/w); }
          const caption = card.querySelector('input[type=text]').value.trim();
          const captionLines = caption ? doc.splitTextToSize(caption, contentW) : [];
          const blockH = imgH + 5 + captionLines.length*4.2 + 6;
          if(py + blockH > ph - 22){ drawFooter(doc,page); doc.addPage(); page++; py = 25; }
          const imgX = pw/2 - imgW/2;
          doc.addImage(card.dataset.dataUrl, 'JPEG', imgX, py, imgW, imgH);
          py += imgH + 4;
          if(caption){
            doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(102,102,102);
            captionLines.forEach(l => { doc.text(l, pw/2, py, {align:'center'}); py += 4.2; });
          }
          py += 5;
        });
        drawFooter(doc, page);
      }

           const clientName = (val('f_client') || 'rapport').replace(/[^a-z0-9]+/gi,'_');
      const dateName = (val('f_date') || '').replace(/[^a-z0-9]+/gi,'-');
      const filename = `Rapport_${CATEGORY_LABELS[key]}_${clientName}${dateName ? '_'+dateName : ''}_FF_CLIM.pdf`;
      const pdfBlob = doc.output('blob');
      downloadBytes(pdfBlob, filename);
                  logHistoryEntry(key, val('f_titre'), val('f_client'), pdfBlob, filename);
      if(confirm('PDF téléchargé ✓\n\nVoulez-vous vider le formulaire pour une nouvelle saisie ?')){
        resetForm();
      }
      statusMsg.textContent = 'PDF téléchargé ✓';
      setTimeout(()=>{ statusMsg.textContent=''; }, 3000);
    } catch(err){
      console.error(err);
      document.getElementById('statusMsg').textContent = "Une erreur est survenue pendant la génération.";
    } finally {
      document.getElementById('downloadBtn').disabled = false;
    }
  }

  REPORT_MODULES[key] = { updatePreview, generatePDF };
}

REPORT_CATEGORIES.forEach(c => initReportModule(c.key));

function saveCerfaDraft(){
  const data = { text: {}, checks: {}, radios: {} };
  document.querySelectorAll('#screen-cerfa input[type=text], #screen-cerfa input[type=email], #screen-cerfa input[type=date], #screen-cerfa textarea, #screen-cerfa select').forEach(el => { data.text[el.id] = el.value; });
  document.querySelectorAll('#screen-cerfa input[type=checkbox]').forEach(el => { data.checks[el.id] = el.checked; });
  document.querySelectorAll('#screen-cerfa input[type=radio]').forEach(el => { if(el.checked) data.radios[el.name] = el.value; });
  try{ localStorage.setItem('ffclim_draft_cerfa', JSON.stringify(data)); } catch(e){}
}
function loadCerfaDraft(){
  let data = null;
  try{ const raw = localStorage.getItem('ffclim_draft_cerfa'); if(raw) data = JSON.parse(raw); } catch(e){}
  if(!data) return;
  Object.keys(data.text || {}).forEach(id => { const el = document.getElementById(id); if(el) el.value = data.text[id]; });
  Object.keys(data.checks || {}).forEach(id => { const el = document.getElementById(id); if(el) el.checked = data.checks[id]; });
  Object.keys(data.radios || {}).forEach(name => {
    const el = document.querySelector(`input[name="${name}"][value="${data.radios[name]}"]`);
    if(el) el.checked = true;
  });
}
function clearCerfaDraft(){
  try{ localStorage.removeItem('ffclim_draft_cerfa'); } catch(e){}
}
function resetCerfaForm(){
  document.querySelectorAll('#screen-cerfa input[type=text], #screen-cerfa input[type=email], #screen-cerfa input[type=date], #screen-cerfa textarea, #screen-cerfa select').forEach(el => { el.value = ''; });
  document.querySelectorAll('#screen-cerfa input[type=checkbox]').forEach(el => { el.checked = false; });
  document.querySelectorAll('#screen-cerfa input[type=radio]').forEach(el => { el.checked = false; });
  clearCerfaDraft();
}
document.getElementById('cerfaClearBtn').addEventListener('click', () => {
  if(!confirm('Effacer toute la saisie de ce formulaire ? Cette action est irréversible.')) return;
  resetCerfaForm();
});
document.getElementById('screen-cerfa').addEventListener('input', saveCerfaDraft);
document.getElementById('screen-cerfa').addEventListener('change', saveCerfaDraft);
loadCerfaDraft();

function base64ToBytes(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function downloadBytes(bytes, filename){
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function dateFR(id){
  const v = document.getElementById(id).value; // YYYY-MM-DD
  if(!v) return {j:'',m:'',a:''};
  const [a,m,j] = v.split('-');
  return {j,m,a};
}

async function generateCerfaPDF(){
  const btn = document.getElementById('downloadBtn');
  const statusMsg = document.getElementById('statusMsg');
  btn.disabled = true; statusMsg.textContent = 'Génération du PDF en cours...';
  try{
    const { PDFDocument } = PDFLib;
    const bytes = base64ToBytes(CERFA_PDF_B64);
    const pdfDoc = await PDFDocument.load(bytes);
    const form = pdfDoc.getForm();

    const g = (id) => document.getElementById(id);
    const v = (id) => (g(id) ? g(id).value.trim() : '');

    function setText(name, value){
      try{ form.getTextField(name).setText(value || ''); } catch(e){ console.warn('text field missing', name); }
    }
    function setCheck(name, checked){
      try{ const f = form.getCheckBox(name); if(checked) f.check(); else f.uncheck(); } catch(e){ console.warn('checkbox missing', name); }
    }
    function setRadio(name, value){
      try{ form.getRadioGroup(name).select(value); } catch(e){ console.warn('radio missing', name); }
    }

    // [Fiche / 1 / 2]
    setText('Fiche_no', v('cerfa_Fiche_no'));
    setText('Operateur', v('cerfa_Operateur'));
    setText('Attestation_no', v('cerfa_Attestation_no'));
    setText('Detenteur', v('cerfa_Detenteur'));

    // [3]
    setText('Equipement_ID', v('cerfa_Equipement_ID'));
    setText('Equipement_Fluide', v('cerfa_Equipement_Fluide'));
    setText('Equipement_Charge', v('cerfa_Equipement_Charge'));
    setText('Equipement_teqCO2', v('cerfa_Equipement_teqCO2'));

    // [4]
    setCheck('Case_Assemblage', g('cerfa_Case_Assemblage').checked);
    setCheck('Case_MiseService', g('cerfa_Case_MiseService').checked);
    setCheck('Case_Modif', g('cerfa_Case_Modif').checked);
    setCheck('Case_Maintenance', g('cerfa_Case_Maintenance').checked);
    setCheck('Case_CtrlPerio', g('cerfa_Case_CtrlPerio').checked);
    setCheck('Case_CtrlNonPerio', g('cerfa_Case_CtrlNonPerio').checked);
    setCheck('Case_Demantel', g('cerfa_Case_Demantel').checked);
    setCheck('Case_Autre', g('cerfa_Case_Autre').checked);
    setText('Autre', v('cerfa_Autre'));

    // [5]/[6]
    setText('Detecteur_ID', v('cerfa_Detecteur_ID'));
    const cd = dateFR('cerfa_Controle_Date');
    setText('Controle_Jour', cd.j); setText('Controle_Mois', cd.m); setText('Controle_Annee', cd.a);
    const detection = document.querySelector('input[name=cerfa_detection]:checked');
    if(detection) setRadio('Bouton_Oui', detection.value);

    // [7]
    ['Case_HCFC_2','Case_HCFC_30','Case_HCFC_300','Case_HFC_5','Case_HFC_50','Case_HFC_500','Case_HFO_1','Case_HFO_10','Case_HFO_100'].forEach(n=>setCheck(n,false));
    const hcfc = document.querySelector('input[name=cerfa_hcfc]:checked'); if(hcfc) setCheck(hcfc.value, true);
    const hfc = document.querySelector('input[name=cerfa_hfc]:checked'); if(hfc) setCheck(hfc.value, true);
    const hfo = document.querySelector('input[name=cerfa_hfo]:checked'); if(hfo) setCheck(hfo.value, true);

    // [8]/[9]
    ['Case_Sans_12m','Case_Sans_6m','Case_Sans_3m','Case_Avec_24m','Case_Avec_12m','Case_Avec_6m'].forEach(n=>setCheck(n,false));
    const sans = document.querySelector('input[name=cerfa_sans]:checked'); if(sans) setCheck(sans.value, true);
    const avec = document.querySelector('input[name=cerfa_avec]:checked'); if(avec) setCheck(avec.value, true);

    // [10]
    const fuite = document.querySelector('input[name=cerfa_fuite]:checked');
    setCheck('Case_Fuite_Oui', fuite && fuite.value === 'oui');
    setCheck('Case_Fuite_Non', fuite && fuite.value === 'non');
    [1,2,3].forEach(n=>{
      setText('Fuite_Loca_' + n, v('cerfa_Fuite_Loca_' + n));
      const rep = v('cerfa_Fuite_Rep_' + n);
      setCheck('Case_Rep_Fuite' + n + '_realisee', rep === 'realisee');
      setCheck('Case_Rep_Fuite' + n + '_AFaire', rep === 'afaire');
    });

    // [11]
    setText('11_Quantite', v('cerfa_11_Quantite'));
    setText('11_QA', v('cerfa_11_QA'));
    setText('11_Denom', v('cerfa_11_Denom'));
    setText('11_QB', v('cerfa_11_QB'));
    setText('11_QC', v('cerfa_11_QC'));
    setText('11_QDE', v('cerfa_11_QDE'));
    setText('11_QD', v('cerfa_11_QD'));
    setText('11_BSFF', v('cerfa_11_BSFF'));
    setText('11_QE', v('cerfa_11_QE'));
    setText('11_Contenant_ID', v('cerfa_11_Contenant_ID'));

    // [12]
    setCheck('Case_12_UN1078', g('cerfa_Case_12_UN1078').checked);
    setCheck('Case_12_Autre140601', g('cerfa_Case_12_Autre140601').checked);
    setText('Autre-FF-NON-inflammable', v('cerfa_Autre-FF-NON-inflammable'));
    setCheck('Case_12_UN3161', g('cerfa_Case_12_UN3161').checked);
    setCheck('Case_12_Autre160504', g('cerfa_Case_12_Autre160504').checked);
    setText('Autre-FF-inflammable', v('cerfa_Autre-FF-inflammable'));

    // [13]/[14]
    setText('13_Instal', v('cerfa_13_Instal'));
    setText('14_Observations', v('cerfa_14_Observations'));

    // Signatures
    setText('Sign_Operateur_Nom', v('cerfa_Sign_Operateur_Nom'));
    setText('Sign_Operateur_Qualite', v('cerfa_Sign_Operateur_Qualite'));
    const opd = dateFR('cerfa_Sign_Operateur_Date');
    setText('Sign_Operateur_Date', (opd.j && opd.m && opd.a) ? `${opd.j}/${opd.m}/${opd.a}` : '');
    setText('Sign_Detenteur_Nom', v('cerfa_Sign_Detenteur_Nom'));
    setText('Sign_Detenteur_Qualite', v('cerfa_Sign_Detenteur_Qualite'));
    const detd = dateFR('cerfa_Sign_Detenteur_Date');
    setText('Sign_Detenteur_Date', (detd.j && detd.m && detd.a) ? `${detd.j}/${detd.m}/${detd.a}` : '');

    form.updateFieldAppearances();
    const outBytes = await pdfDoc.save();

        const ficheNo = (v('cerfa_Fiche_no') || 'sans_numero').replace(/[^a-z0-9]+/gi,'_');
    const filename = `CERFA_15497_${ficheNo}.pdf`;
            downloadBytes(outBytes, filename);
    logHistoryEntry('cerfa', 'CERFA 15497*04', v('cerfa_Detenteur') || v('cerfa_Operateur') || '', new Blob([outBytes], {type:'application/pdf'}), filename);
    if(confirm('PDF téléchargé ✓\n\nVoulez-vous vider le formulaire pour une nouvelle saisie ?')){
      resetCerfaForm();
    }
    statusMsg.textContent = 'PDF téléchargé ✓';
    setTimeout(()=>{ statusMsg.textContent=''; }, 3000);
  } catch(err){
    console.error(err);
    document.getElementById('statusMsg').textContent = "Une erreur est survenue pendant la génération.";
  } finally {
    btn.disabled = false;
  }
}

        <div class="status-msg" id="adm_create_status"></div>
      </div>

      <div class="card">
        <h2><span class="num">👥</span>Utilisateurs (<span id="adm_user_count">0</span>/10)</h2>
        <div id="adm_user_list"></div>
      </div>
    </div>
  `;
}

function renderUserRow(profile, permsMap){
  const isSelf = profile.id === currentUser.id;
  const catChecks = ADMIN_CATEGORIES.map(c => `
    <label class="perm-chip">
      <input type="checkbox" data-user="${profile.id}" data-cat="${c.key}" ${permsMap[c.key] ? 'checked' : ''}>
      ${c.label}
    </label>
  `).join('');
  const safeName = (profile.full_name || '').replace(/"/g,'&quot;');
  const safeEmail = (profile.email || '').replace(/"/g,'&quot;');
  return `
    <div class="user-row" data-user-id="${profile.id}">
      <div class="user-row-head">
        <div>
          <div class="user-name">${profile.full_name || '(sans nom)'} ${isSelf ? '<span class="you-tag">vous</span>' : ''}</div>
          <div class="user-email">${profile.email || ''}</div>
        </div>
        <label class="admin-toggle">
          <input type="checkbox" class="adm_role_toggle" data-user="${profile.id}" ${profile.role === 'admin' ? 'checked' : ''} ${isSelf ? 'disabled' : ''}>
          Admin
        </label>
      </div>
      <div class="perm-chips">${catChecks}</div>

      <div class="edit-panel" id="edit_${profile.id}" style="display:none;">
        <div class="field"><label>Nom complet</label><input type="text" class="edit_name" data-user="${profile.id}" value="${safeName}"></div>
        <div class="field"><label>Email</label><input type="email" class="edit_email" data-user="${profile.id}" value="${safeEmail}"></div>
        <div class="field"><label>Nouveau mot de passe (laisser vide pour ne pas changer)</label><input type="text" class="edit_password" data-user="${profile.id}" placeholder="min. 6 caractères"></div>
        <div class="status-msg" id="edit_status_${profile.id}"></div>
        <button class="btn-primary edit_save_btn" data-user="${profile.id}" type="button" style="width:100%;">Enregistrer les modifications</button>
      </div>

      <div class="row-actions">
        <button class="edit-toggle-btn" data-user="${profile.id}" type="button">✎ Modifier</button>
        <button class="adm_delete_btn" data-user="${profile.id}" type="button" ${isSelf ? 'disabled' : ''}>✕ Supprimer</button>
      </div>
    </div>
  `;
}

async function loadAdminUsers(){
  const listEl = document.getElementById('adm_user_list');
  listEl.innerHTML = '<p style="color:var(--ink-soft); font-size:13px;">Chargement...</p>';

  const { data: profiles, error } = await sb.from('profiles').select('*').order('created_at', { ascending: true });
  if(error){ listEl.innerHTML = '<p style="color:var(--danger); font-size:13px;">Erreur de chargement.</p>'; return; }

  const { data: perms } = await sb.from('permissions').select('*');
  const permsByUser = {};
  (perms || []).forEach(p => {
    if(!permsByUser[p.user_id]) permsByUser[p.user_id] = {};
    permsByUser[p.user_id][p.category] = p.allowed;
  });

  document.getElementById('adm_user_count').textContent = profiles.length;
  listEl.innerHTML = profiles.map(p => renderUserRow(p, permsByUser[p.id] || {})).join('');

  listEl.querySelectorAll('input[type=checkbox][data-cat]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const userId = cb.dataset.user, cat = cb.dataset.cat, allowed = cb.checked;
      await sb.from('permissions').upsert({ user_id: userId, category: cat, allowed }, { onConflict: 'user_id,category' });
    });
  });

  listEl.querySelectorAll('.adm_role_toggle').forEach(cb => {
    cb.addEventListener('change', async () => {
      const userId = cb.dataset.user;
      const newRole = cb.checked ? 'admin' : 'user';
      const { error } = await sb.from('profiles').update({ role: newRole }).eq('id', userId);
      if(error){ alert("Impossible : " + error.message); cb.checked = !cb.checked; }
    });
  });

    listEl.querySelectorAll('.adm_delete_btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Supprimer définitivement ce compte ?')) return;
      btn.disabled = true;
      const result = await callAdminFunction({ action: 'delete', user_id: btn.dataset.user });
      if(result.error){ alert('Erreur : ' + result.error); btn.disabled = false; return; }
      loadAdminUsers();
    });
  });

  listEl.querySelectorAll('.edit-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = document.getElementById('edit_' + btn.dataset.user);
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
  });

  listEl.querySelectorAll('.edit_save_btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const userId = btn.dataset.user;
      const nameEl = listEl.querySelector(`.edit_name[data-user="${userId}"]`);
      const emailEl = listEl.querySelector(`.edit_email[data-user="${userId}"]`);
      const passEl = listEl.querySelector(`.edit_password[data-user="${userId}"]`);
      const statusEl = document.getElementById('edit_status_' + userId);
      const name = nameEl.value.trim();
      const email = emailEl.value.trim();
      const password = passEl.value;
      if(password && password.length < 6){
        statusEl.textContent = "Le mot de passe doit faire au moins 6 caractères.";
        return;
      }
      btn.disabled = true; statusEl.textContent = 'Enregistrement...';
      const payload = { action: 'update', user_id: userId, full_name: name, email };
      if(password) payload.password = password;
      const result = await callAdminFunction(payload);
      btn.disabled = false;
      if(result.error){ statusEl.textContent = 'Erreur : ' + result.error; return; }
      statusEl.textContent = 'Modifié ✓';
      loadAdminUsers();
    });
  });
}

async function callAdminFunction(payload){
  const { data: sessionData } = await sb.auth.getSession();
  const token = sessionData.session.access_token;
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-users`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify(payload),
  });
  return res.json();
}

document.getElementById('screen-admin').innerHTML = adminScreenTemplate();
document.getElementById('adm_create_btn').addEventListener('click', async () => {
  const name = document.getElementById('adm_new_name').value.trim();
  const email = document.getElementById('adm_new_email').value.trim();
  const password = document.getElementById('adm_new_password').value;
  const statusEl = document.getElementById('adm_create_status');
  const btn = document.getElementById('adm_create_btn');
  statusEl.textContent = '';
  if(!email || !password || password.length < 6){
    statusEl.textContent = "Email requis, mot de passe d'au moins 6 caractères.";
    return;
  }
  btn.disabled = true; statusEl.textContent = 'Création en cours...';
  const result = await callAdminFunction({ action: 'create', email, password, full_name: name });
  btn.disabled = false;
  if(result.error){ statusEl.textContent = 'Erreur : ' + result.error; return; }
  await sb.from('profiles').update({ email }).eq('id', result.user.id);
  document.getElementById('adm_new_name').value = '';
  document.getElementById('adm_new_email').value = '';
  document.getElementById('adm_new_password').value = '';
  statusEl.textContent = 'Utilisateur créé ✓';
  loadAdminUsers();
});

function slugify(str){
  return (str || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève les accents
    .replace(/[^a-zA-Z0-9._-]+/g, '_');
}

async function logHistoryEntry(category, missionTitle, client, pdfBlob, filename){
  try{
    const safeFilename = slugify(filename);
    const path = `${category}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeFilename}`;
    const { error: upErr } = await sb.storage.from('reports').upload(path, pdfBlob, { contentType: 'application/pdf' });
    if(upErr){ console.warn('Échec upload historique', upErr); return; }
    await sb.from('history').insert({
      category,
      client: client || null,
      mission_title: missionTitle || null,
      created_by: currentUser.id,
      created_by_name: (currentProfile && (currentProfile.full_name || currentProfile.email)) || null,
      pdf_path: path,
    });
  } catch(e){ console.warn('Échec enregistrement historique', e); }
}

const HISTORY_CATEGORY_LABELS = { diagnostic:'Diagnostic', travaux:'Travaux', depannage:'Dépannage', maintenance:'Maintenance', cerfa:'CERFA' };

function historyScreenTemplate(){
  return `
    <div class="history-wrap">
      <div class="field">
        <label>Filtrer par catégorie</label>
        <select id="hist_filter">
          <option value="">Toutes les catégories</option>
          <option value="diagnostic">Diagnostic</option>
          <option value="travaux">Travaux</option>
          <option value="depannage">Dépannage</option>
          <option value="maintenance">Maintenance</option>
          <option value="cerfa">CERFA</option>
        </select>
      </div>
      <div id="hist_list" style="margin-top:16px;"></div>
    </div>
  `;
}
document.getElementById('screen-history').innerHTML = historyScreenTemplate();
document.getElementById('hist_filter').addEventListener('change', loadHistory);

async function loadHistory(){
  const listEl = document.getElementById('hist_list');
  listEl.innerHTML = '<p style="color:var(--ink-soft); font-size:13px;">Chargement...</p>';
  const filter = document.getElementById('hist_filter').value;
  let query = sb.from('history').select('*').order('created_at', { ascending: false }).limit(100);
  if(filter) query = query.eq('category', filter);
  const { data, error } = await query;
  if(error){ listEl.innerHTML = '<p style="color:var(--danger); font-size:13px;">Erreur de chargement.</p>'; return; }
  if(!data.length){ listEl.innerHTML = '<p style="color:var(--ink-soft); font-size:13px;">Aucun rapport dans l\'historique pour le moment.</p>'; return; }

  listEl.innerHTML = data.map(h => {
    const d = new Date(h.created_at);
    const dateStr = d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    return `
      <div class="hist-row">
        <div class="hist-main">
          <span class="hist-badge">${HISTORY_CATEGORY_LABELS[h.category] || h.category}</span>
          <div class="hist-title">${h.mission_title || h.client || '(sans titre)'}</div>
          <div class="hist-meta">${h.client ? h.client + ' · ' : ''}${dateStr} · par ${h.created_by_name || '—'}</div>
        </div>
        <button class="hist-dl-btn" data-path="${h.pdf_path}">⬇</button>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.hist-dl-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = '...';
      const { data: fileData, error: dlErr } = await sb.storage.from('reports').download(btn.dataset.path);
      btn.disabled = false; btn.textContent = '⬇';
      if(dlErr){ alert('Erreur de téléchargement : ' + dlErr.message); return; }
      const filename = btn.dataset.path.split('/').pop();
      downloadBytes(fileData, filename);
    });
  });
}

/* ---------------- PWA: "install" prompt handling (Android/Chrome) ---------------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-flex';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});
